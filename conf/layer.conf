BBPATH .= ":${LAYERDIR}"

BBFILES += "\
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
           "

BBFILE_COLLECTIONS += "video"
BBFILE_PATTERN_video := "^${LAYERDIR}/"
BBFILE_PRIORITY_video = "7"
LAYERSERIES_COMPAT_video = "zeus dunfell kirkstone"

# license directories.
LICENSE_PATH += "${LAYERDIR}/licenses"

require conf/distro/include/rdk_video_lto.inc

# Temporary TTS build troubleshooting: revert this block and the TTS-disable
# bbappends in recipes-extended/{wpe-webkit,entservices,thunderstartupservices,rdkat}
# and recipes-graphics/tts to restore TTS.
# Image-wide settings belong here, not in a component recipe's bbappend.
IMAGE_INSTALL:remove = "tts rdkat rdkat-atspi2"
CORE_IMAGE_EXTRA_INSTALL:remove = "tts rdkat rdkat-atspi2"
BAD_RECOMMENDATIONS += "tts rdkat rdkat-atspi2"

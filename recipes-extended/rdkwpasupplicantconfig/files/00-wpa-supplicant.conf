

[Unit]
Requires=dbus.service
After=dbus.service

[Service]
Type=dbus
BusName=fi.w1.wpa_supplicant1
SyslogIdentifier=wpa_supplicant
ExecStartPre=/bin/sh -c 'source /lib/rdk/prepareWpaSuppConfig.sh'
# Reset ExecStart
ExecStart=
ExecStart=/bin/sh -c 'exec /usr/sbin/wpa_supplicant $WPA_SUPP_ARGS'
RestartSec=10s
Restart=always

